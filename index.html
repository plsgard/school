<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mon école à la maison</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
        body { background: #e9f2fb; color: #223252; overflow-x: hidden; }
        .picker { max-width: 520px; }
        .picker h1 { font-size: 32px; font-weight: 700; }
        #profiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .avatar { border: 3px solid #d7e2f0; background: #f4f8fd; border-radius: 28px; padding: 18px 10px; text-align: center; color: #223252; min-height: 56px; touch-action: manipulation; }
        .avatar:active { transform: translateY(2px); }
        .avatar .face { font-size: 88px; line-height: 1.1; display: block; }
        .avatar b { display: block; font-size: 22px; margin-top: 6px; overflow-wrap: anywhere; }
        .avatar small { display: block; color: #6b7a99; font-size: 15px; }
        .picker .rename { color: #6b7a99; }
        .picker summary { padding: 10px 0; font-weight: 600; }
        .picker details li { margin: 6px 0; }
        /* Parent-only rename: long-press, the button fills from the left while held. */
        .hold-gate { position: relative; overflow: hidden; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        .hold-gate::after { content: ""; position: absolute; inset: 0; background: rgba(255, 183, 3, .45); transform: scaleX(0); transform-origin: left; pointer-events: none; }
        .hold-gate.holding::after { transform: scaleX(1); transition: transform var(--hold-ms, 1.5s) linear; }
    </style>
</head>

<body>
    <div class="container picker my-4">
        <h1 class="mb-3">Qui joue&nbsp;?</h1>
        <div id="profiles"></div>
        <div class="text-center mt-2">
            <button type="button" class="btn btn-link btn-sm rename" id="rename">✏️ Modifier les prénoms (appui long)</button>
        </div>
        <details class="mt-3" id="math">
            <summary>Autres jeux</summary>
            <ul class="mt-2">
                <li><a href="multiplication.html">Multiplication</a></li>
                <li><a href="addition.html">Addition</a></li>
            </ul>
        </details>
    </div>
    <script type="module">
        import { mountProfiles } from './assets/profiles.js';
        if (location.hash === '#math') document.getElementById('math').open = true; // en.html's "🧮 Maths" link
        mountProfiles(document.getElementById('profiles'), {
            otherGames: document.getElementById('math'),
            renameButton: document.getElementById('rename'),
        });
    </script>
</body>

</html>
