<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complement of Addition Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="assets/quiz.css" rel="stylesheet">
</head>

<body class="bg-light">
    <noscript>
        <div class="container my-5">
            <div class="alert alert-warning">This quiz needs JavaScript to run. Please enable it in your browser.</div>
        </div>
    </noscript>
    <div class="container my-5">
        <div class="text-center">
            <h1 class="mb-4">Complement of Addition Quiz</h1>
        </div>

        <div id="settings" class="card p-4 shadow-sm mb-4">
            <h2 class="mb-3">Quiz Settings</h2>
            <div class="mb-3">
                <label for="complementNumber" class="form-label">Complement Number:</label>
                <input type="number" id="complementNumber" class="form-control" min="1" value="7" inputmode="numeric"
                    pattern="[0-9]*">
            </div>
            <div class="mb-3">
                <label for="numQuestions" class="form-label">Number of Questions:</label>
                <input type="number" id="numQuestions" class="form-control" min="1" value="20" inputmode="numeric"
                    pattern="[0-9]*">
            </div>
            <div class="mb-3">
                <label for="timerDuration" class="form-label">Timer (seconds):</label>
                <input type="number" id="timerDuration" class="form-control" min="10" value="60" inputmode="numeric"
                    pattern="[0-9]*">
            </div>
            <button id="startQuiz" class="btn btn-primary w-100">Start Quiz</button>
        </div>

        <div id="quiz" class="card p-4 shadow-sm mb-4 visually-hidden">
            <h2 class="mb-3">Quiz</h2>
            <div id="questions" class="mb-3"></div>
            <div class="timer mb-3" id="timer" role="timer" aria-label="Time remaining">Time Left: 60s</div>
            <button id="submit" class="btn btn-success w-100">Submit</button>
        </div>

        <div id="result" class="card p-4 shadow-sm mb-4 visually-hidden" role="status">
            <h2>Quiz Results</h2>
        </div>

        <div id="history" class="card p-4 shadow-sm">
            <h2>Latest Results</h2>
            <ul id="historyList" class="list-group"></ul>
        </div>

        <div id="celebration" class="celebration visually-hidden">
            🎉 Congratulations! You got everything correct! 🎉
        </div>
        <div class="confetti" id="confetti"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
    <script type="module">
        import { startQuiz } from './assets/quiz.js';

        const complementInput = document.getElementById('complementNumber');

        startQuiz({
            quizId: 'addition',
            validateSettings: () => {
                const target = parseInt(complementInput.value, 10);
                if (Number.isNaN(target) || target < 1) {
                    return 'Please enter a complement number of at least 1.';
                }
                return null;
            },
            generateQuestion: () => {
                const target = parseInt(complementInput.value, 10);
                // knownNumber is in [0, target-1] on purpose: avoid the trivial "N + ... = N" with answer 0.
                const known = Math.floor(Math.random() * target);
                return {
                    equation: `${known} + ... = ${target}`,
                    answer: target - known,
                };
            },
        });
    </script>
</body>

</html>
